<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunday's Laundry Spot - Ajegunle, Lagos </title>
    <link rel = "stylesheet" href = "headerPractice.css">
</head>
<body>
    <header>
        <div class = "logo-holder">
            <img src = "logo.png" alt = "Sunday's Laundry Spot logo">
            <div class = "brand-details">
                <h1><span>Sunday's</span> Laundry Spot</h1>
                <p>CLEANER CLOTHES, BETTER <br>LIVING</p>
            </div>
        </div>
        <div class = "nav-menu">
            <nav>Services</nav>
            <nav>Prices</nav>
            <nav>How it <br>works</nav>
            <nav>Questions</nav>
            <nav>Complaints</nav>
        </div>
        <div class = "action-btns">
            <button class="install-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                 <line x1="12" y1="15" x2="12" y2="3"/>
                 </svg>
                <span>Install<br>app</span>
            </button>
            <div class = "language-switch">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m5 8 6 6"/>
                    <path d="m4 14 6-6 2-3"/>
                    <path d="M2 5h12"/>
                    <path d="M7 2h1"/>
                    <path d="m22 22-5-10-5 10"/>
                    <path d="M14 18h6"/>>
                </svg>
                <span class = "active">English</span>
                <span>Pidgin</span>
            </div>
            <nav>Log <br>in</nav>
            <button class = "pick-up">Book a <br>pickup</button>
        </div>
    </header>
</body>
</html>
